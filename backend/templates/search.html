<!DOCTYPE html>
<html>

<head>

    <title>Search Logs</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background-color: #f4f4f4;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        form {
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <h1>Search Logs</h1>

    <form method="GET" action="/search">

        <input
            type="text"
            name="q"
            placeholder="Search logs..."
            value="{{ keyword }}"
        >

        <button type="submit">
            Search
        </button>

    </form>

    <table>

        <tr>
            <th>Timestamp</th>
            <th>Level</th>
            <th>Message</th>
        </tr>

        {% for log in logs %}

        <tr>
            <td>{{ log[0] }}</td>
            <td>{{ log[1] }}</td>
            <td>{{ log[2] }}</td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
